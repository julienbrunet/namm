# Mises à jour proposées en pull request (rien n'est fusionné automatiquement).
# Après une mise à jour Gradle, régénérer android-app/gradle/verification-metadata.xml (voir CLAUDE.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android-app
    schedule:
      interval: weekly
    # Laisser deux semaines à une nouvelle version avant de la proposer (paquets piégés vite retirés).
    cooldown:
      default-days: 14
    groups:
      dependances:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
