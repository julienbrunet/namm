name: Android

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# Par défaut, lecture seule. Seul le job « release » (sans secret de signature) peut écrire.
# Actions figées par SHA de commit (un tag peut être déplacé) ; Dependabot les met à jour.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Version 0.<1 + n/100>.<n % 100> : le dernier chiffre ne dépasse jamais 99
      # (build 99 → 0.1.99, build 100 → 0.2.0). Calculée par Gradle, source unique.
      - name: Version
        id: version
        run: echo "name=$(./gradlew -q printVersionName)" >> "$GITHUB_OUTPUT"

      - name: Tests unitaires + captures d'écran
        run: ./gradlew testDebugUnitTest recordRoborazziDebug

      - name: Clé de signature (si les secrets existent)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk no-ad-meteo.apk

      # Garde-fou : R8 ne doit pas fusionner les classes de widgets (sinon tous les widgets
      # affichent la même variante). Chaque classe doit rester présente sous son nom.
      - name: Vérifier les classes de widgets dans l'APK release
        run: |
          for w in Mini Rain Day TwelveHours Week Map; do
            grep -q "^com.namm.meteo.widget.${w}Widget -> com.namm.meteo.widget.${w}Widget:" \
              app/build/outputs/mapping/release/mapping.txt || { echo "Classe ${w}Widget fusionnée par R8"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-and-screenshots
          path: |
            android-app/no-ad-meteo.apk
            android-app/app/screenshots/*.png

  # Publication séparée : ce job a le droit d'écrire sur le dépôt mais ne voit ni le code
  # compilé ni les secrets de signature ; il ne fait que joindre l'APK déjà signé à la release.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-and-screenshots

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: No Ad Météo ${{ needs.build.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: no-ad-meteo.apk
