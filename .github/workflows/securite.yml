name: Sécurité

# Analyses gratuites intégrées à GitHub ; résultats dans l'onglet « Security » du dépôt.
# - CodeQL : failles dans le code Kotlin et dans les workflows GitHub Actions.
# - Graphe des dépendances Gradle : alimente les alertes Dependabot (bibliothèques vulnérables).
# - Dependency review : sur une PR, refuse l'ajout d'une dépendance vulnérable.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # chaque lundi : nouvelles règles CodeQL et nouvelles CVE
  workflow_dispatch:

# Lecture seule par défaut ; chaque job ne reçoit que le droit d'écriture dont il a besoin.
# Aucun secret n'est utilisé. Actions figées par SHA de commit.
permissions:
  contents: read

concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # envoi des résultats dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: matrix.language == 'java-kotlin'

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # CodeQL observe le compilateur Kotlin : compilation complète (sans cache), dans le
      # processus Gradle pour qu'elle soit vue, du code livré (variante release).
      - name: Compilation de l'app
        if: matrix.build-mode == 'manual'
        working-directory: android-app
        run: >
          ./gradlew --no-daemon --no-build-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          :app:compileReleaseSources

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  # Le build Gradle (code du dépôt) tourne en lecture seule ; l'envoi du graphe, qui demande
  # le droit d'écriture, se fait dans un job séparé qui n'exécute aucun code du dépôt.
  # Graphe limité aux bibliothèques embarquées dans l'APK (releaseRuntimeClasspath).
  dependances:
    name: Graphe des dépendances
    # Pas de schedule : le graphe ne change qu'avec le code. Les PR de forks sont ignorées.
    if: >
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      # Version figée : ses checksums sont dans gradle/verification-metadata.xml.
      DEPENDENCY_GRAPH_PLUGIN_VERSION: 1.4.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          build-root-directory: android-app
          dependency-graph: generate-and-upload
          dependency-graph-include-configurations: releaseRuntimeClasspath

  envoi-graphe:
    name: Envoi du graphe des dépendances
    needs: dependances
    runs-on: ubuntu-latest
    permissions:
      contents: write # API Dependency submission
      actions: read # lecture de l'artefact produit par le job précédent
    steps:
      - uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          dependency-graph: download-and-submit

  revue-dependances:
    name: Revue des dépendances
    needs: envoi-graphe
    # Aussi sur les PR de forks (graphe Gradle absent, mais actions GitHub vérifiées).
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Laisse au graphe Gradle, envoyé juste avant, le temps d'être pris en compte.
          retry-on-snapshot-warnings: true
