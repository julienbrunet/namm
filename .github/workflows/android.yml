name: Android

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# Par défaut, lecture seule. Seul le job « release » (sans secret de signature) peut écrire.
# Actions figées par SHA de commit (un tag peut être déplacé) ; Dependabot les met à jour.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Version 0.<1 + n/100>.<n % 100> : le dernier chiffre ne dépasse jamais 99
      # (build 99 → 0.1.99, build 100 → 0.2.0). Calculée par Gradle, source unique.
      - name: Version
        id: version
        run: echo "name=$(./gradlew -q printVersionName)" >> "$GITHUB_OUTPUT"

      - name: Tests unitaires + captures d'écran
        run: ./gradlew testDebugUnitTest recordRoborazziDebug

      - name: Clé de signature (si les secrets existent)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk yama.apk

      # Garde-fou : R8 ne doit pas fusionner les classes de widgets (sinon tous les widgets
      # affichent la même variante). Chaque classe doit rester présente sous son nom.
      - name: Vérifier les classes de widgets dans l'APK release
        run: |
          for w in Mini Rain Day TwelveHours Week Map; do
            grep -q "^fr.jbrunet.yama.widget.${w}Widget -> fr.jbrunet.yama.widget.${w}Widget:" \
              app/build/outputs/mapping/release/mapping.txt || { echo "Classe ${w}Widget fusionnée par R8"; exit 1; }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-and-screenshots
          path: |
            android-app/yama.apk
            android-app/app/screenshots/*.png

  # Publication séparée : ce job a le droit d'écrire sur le dépôt mais ne voit ni le code
  # compilé ni les secrets de signature ; il ne fait que joindre l'APK déjà signé à la release.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk-and-screenshots

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YAMA ${{ needs.build.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: yama.apk
