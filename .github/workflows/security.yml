name: Security

# Free analyses built into GitHub; results in the repository's “Security” tab.
# - CodeQL: flaws in the Kotlin code and in the GitHub Actions workflows.
# - Gradle dependency graph: feeds Dependabot alerts (vulnerable libraries).
# - Dependency review: on a PR, rejects the addition of a vulnerable dependency.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # every Monday: new CodeQL rules and new CVEs
  workflow_dispatch:

# Read-only by default; each job only gets the write permission it needs.
# No secret is used. Actions pinned by commit SHA.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload of the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: matrix.language == 'java-kotlin'

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # CodeQL watches the Kotlin compiler: full build (no cache), inside the Gradle
      # process so that it is seen, of the shipped code (release variant).
      - name: Build the app
        if: matrix.build-mode == 'manual'
        working-directory: android-app
        run: >
          ./gradlew --no-daemon --no-build-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          :app:compileReleaseSources

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  # The Gradle build (repository code) runs read-only; the graph upload, which needs
  # write permission, happens in a separate job that runs no repository code.
  # Graph limited to the libraries shipped in the APK (releaseRuntimeClasspath).
  dependencies:
    name: Dependency graph
    # Not on schedule: the graph only changes with the code. PRs from forks are skipped.
    if: >
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      # Pinned version: its checksums are in gradle/verification-metadata.xml.
      DEPENDENCY_GRAPH_PLUGIN_VERSION: 1.4.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          build-root-directory: android-app
          dependency-graph: generate-and-upload
          dependency-graph-include-configurations: releaseRuntimeClasspath

  submit-graph:
    name: Submit the dependency graph
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dependency submission API
      actions: read # reads the artifact produced by the previous job
    steps:
      - uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          dependency-graph: download-and-submit

  dependency-review:
    name: Dependency review
    needs: submit-graph
    # Also on PRs from forks (no Gradle graph, but GitHub actions are checked).
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Gives the Gradle graph, submitted just before, time to be taken into account.
          retry-on-snapshot-warnings: true
