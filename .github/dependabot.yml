# Updates proposed as pull requests (nothing is merged automatically).
# After a Gradle update, regenerate android-app/gradle/verification-metadata.xml (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android-app
    schedule:
      interval: weekly
    # Give a new version two weeks before proposing it (booby-trapped packages are pulled quickly).
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
