name: Android

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# Read-only by default. Only the “release” job (without signing secrets) can write.
# Actions pinned by commit SHA (a tag can be moved); Dependabot updates them.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Classic semver, hand-maintained in app/build.gradle.kts (single source).
      - name: Version
        id: version
        run: echo "name=$(./gradlew -q printVersionName)" >> "$GITHUB_OUTPUT"

      - name: Unit tests + screenshots
        run: ./gradlew testDebugUnitTest recordRoborazziDebug

      - name: Signing key (if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk yama.apk

      # Safeguard: R8 must not merge the widget classes (otherwise every widget shows
      # the same variant). Each class must stay present under its own name.
      - name: Check the widget classes in the release APK
        run: |
          for w in Mini Rain Day TwelveHours Week Map; do
            grep -q "^fr.jbrunet.yama.widget.${w}Widget -> fr.jbrunet.yama.widget.${w}Widget:" \
              app/build/outputs/mapping/release/mapping.txt || { echo "Class ${w}Widget merged by R8"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-and-screenshots
          path: |
            android-app/yama.apk
            android-app/app/screenshots/**/*.png

  # Separate publishing: this job may write to the repository but sees neither the built code
  # nor the signing secrets; it only attaches the already signed APK to the release.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-and-screenshots

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YAMA ${{ needs.build.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: yama.apk
